# PPO LunarLander 설정 (SB3 rl-zoo 참고: sb3/ppo-LunarLander-v2)
# rl-zoo와 다른 점: num_envs 16 대신 8 (공통), learning_rate는 SB3 기본값
# minibatch_size는 num_envs × num_steps (8 × 1024 = 8192)를 나눠떨어지게

num_steps: 1024
learning_rate: 0.0003
gae_lambda: 0.98
vf_coef: 0.5
ent_coef: 0.01
max_grad_norm: 0.5

num_epochs: 4
minibatch_size: 64
clip_coef: 0.2
norm_adv: true
